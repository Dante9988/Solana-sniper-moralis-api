  - deploy

# Run tests and linting
test-job:
  stage: test
  script:
    - npm run lint
    - npm test

# Simple deployment
deploy-job:
  stage: deploy
  script:
    - echo "Add your deployment commands here"
  only:
    - main
  when: manual
