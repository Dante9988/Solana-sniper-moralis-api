# Use your Docker image from Docker Hub
image: anvarxadja35/solana-sniper-bot:latest

variables:
  DOCKER_TLS_CERTDIR: ""  # Required for newer GitLab runners

before_script:
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

stages:
  - test
  - deploy

# Run tests and linting
test-job:
  stage: test
  script:
    - npm run lint
    - npm test

# Simple deployment
deploy-job:
  stage: deploy
  script:
    - echo "Add your deployment commands here"
  only:
    - main
  when: manual
