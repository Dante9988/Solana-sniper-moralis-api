name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A disposable PostgreSQL 16 service container, not a placeholder — it
    # starts empty on every run, so `prisma migrate deploy` below is a real
    # clean-install validation of the full migration chain (including the
    # restored 20250324020906_init baseline — see ARCHITECTURE.md §3/§5.6)
    # against real PostgreSQL, not just a string Prisma Client never
    # connects with. CI-only credentials; never production, never a
    # persisted/shared database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_migrate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_migrate_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U ci -d ci_migrate_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Migrate deploy (clean-install validation against a fresh database)
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      # Phase 7B.5A §10/§12 — the *.dbIntegration.test.ts suites (Pons,
      # Pump, forensics job service, wallet verification, robinhoodTokens
      # HTTP) are opt-in behind their own RUN_DB_TESTS flags and are
      # otherwise skipped by "Run tests" above, even though this job's
      # disposable Postgres (never production, never shared) is exactly
      # the environment they need. Run them here explicitly so this
      # coverage is real in CI, not silently skipped. --no-file-parallelism
      # because the Pons/Pump dbIntegration files intentionally share
      # fixture-derived row identities and race if run concurrently.
      - name: Run opt-in DB-integration test suites (serial, disposable Postgres)
        run: npx vitest run --no-file-parallelism
        env:
          PONS_RUN_DB_TESTS: "true"
          PUMP_RUN_DB_TESTS: "true"
          FORENSICS_RUN_DB_TESTS: "true"
          WALLET_RUN_DB_TESTS: "true"

      # Phase 7B.5A follow-up — reorgRecovery.dbIntegration.test.ts proves
      # the recovery algorithm against a scripted fake chain reader; this
      # additionally proves the same production PonsChainClient/
      # DiscoveryListener/reorgRecovery.ts code path against a genuinely
      # reorging real EVM JSON-RPC node (Foundry's anvil, via its real
      # evm_snapshot/evm_revert), the standard way the EVM tooling
      # ecosystem tests reorg handling without needing a live chain to
      # misbehave. It cannot run against Robinhood Chain mainnet itself —
      # a real reorg there can't safely be forced on demand.
      - name: Install Foundry (for the real-anvil reorg recovery proof)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run real-anvil reorg recovery proof (genuine node reorg, not mocked)
        run: npx vitest run src/pons/__tests__/reorgRecovery.anvilFork.test.ts
        env:
          PONS_RUN_ANVIL_REORG_TEST: "true"

      - name: Build
        run: npm run build
