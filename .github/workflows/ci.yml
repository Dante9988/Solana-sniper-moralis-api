name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A disposable PostgreSQL 16 service container, not a placeholder — it
    # starts empty on every run, so `prisma migrate deploy` below is a real
    # clean-install validation of the full migration chain (including the
    # restored 20250324020906_init baseline — see ARCHITECTURE.md §3/§5.6)
    # against real PostgreSQL, not just a string Prisma Client never
    # connects with. CI-only credentials; never production, never a
    # persisted/shared database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_migrate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_migrate_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U ci -d ci_migrate_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Migrate deploy (clean-install validation against a fresh database)
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: OpenAPI contract drift
        run: npm run openapi:check

      - name: Run tests
        run: npx vitest run

      # Phase 7B.5A §10/§12 — the *.dbIntegration.test.ts suites (Pons,
      # Pump, forensics job service, wallet verification, robinhoodTokens
      # HTTP) are opt-in behind their own RUN_DB_TESTS flags and are
      # otherwise skipped by "Run tests" above, even though this job's
      # disposable Postgres (never production, never shared) is exactly
      # the environment they need. Run them here explicitly so this
      # coverage is real in CI, not silently skipped. --no-file-parallelism
      # because the Pons/Pump dbIntegration files intentionally share
      # fixture-derived row identities and race if run concurrently.
      - name: Run opt-in DB-integration test suites (serial, disposable Postgres)
        run: npx vitest run --no-file-parallelism
        env:
          PONS_RUN_DB_TESTS: "true"
          PUMP_RUN_DB_TESTS: "true"
          FORENSICS_RUN_DB_TESTS: "true"
          WALLET_RUN_DB_TESTS: "true"
          # Phase 7B.5B — candle domain dbIntegration suites (aggregation
          # service, reorg-invalidation recompute, candle API route), same
          # opt-in convention as the flags above.
          CANDLES_RUN_DB_TESTS: "true"
          # Phase 7D.3.2 — paper positions, evidence snapshots, logo cache.
          PAPER_RUN_DB_TESTS: "true"
          # Phase 7E.1 — real execution: idempotency under concurrency, one hash
          # per execution, reload restoration and receipt reconciliation. These
          # need a real PostgreSQL because the guarantees are unique indexes, not
          # service-layer checks.
          EXECUTIONS_RUN_DB_TESTS: "true"

      # Phase 7B.5A follow-up — reorgRecovery.dbIntegration.test.ts proves
      # the recovery algorithm against a scripted fake chain reader; this
      # additionally proves the same production PonsChainClient/
      # DiscoveryListener/reorgRecovery.ts code path against a genuinely
      # reorging real EVM JSON-RPC node (Foundry's anvil, via its real
      # evm_snapshot/evm_revert), the standard way the EVM tooling
      # ecosystem tests reorg handling without needing a live chain to
      # misbehave. It cannot run against Robinhood Chain mainnet itself —
      # a real reorg there can't safely be forced on demand.
      - name: Install Foundry (for the real-anvil reorg recovery proof)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run real-anvil reorg recovery proof (genuine node reorg, not mocked)
        run: npx vitest run src/pons/__tests__/reorgRecovery.anvilFork.test.ts
        env:
          PONS_RUN_ANVIL_REORG_TEST: "true"

      # Phase 7E.1 §22 — real BUY and SELL on both venues against a real fork of
      # Robinhood Chain, driven by the calldata the execution service actually
      # emits. Runs after the anvil install above. Needs an archive-capable RPC;
      # skipped rather than failed when the secret is absent, because a fork of a
      # live chain cannot be reproduced without one.
      - name: Run execution fork proof (real contracts, production calldata)
        if: ${{ env.EXECUTION_FORK_RPC != '' }}
        run: npx vitest run src/pons/execution/__tests__/execution.anvilFork.test.ts
        env:
          PONS_RUN_EXECUTION_FORK_TEST: "true"
          EXECUTION_FORK_RPC: ${{ secrets.ROBINHOOD_ARCHIVE_RPC }}

      - name: Build
        run: npm run build

  # Phase 7D.3.2 §2 — Solidity verification, in its own job so a slow or blocked fork never
  # hides the Node results above, and vice versa.
  #
  #   1. The self-contained suite (test-hook results: v4-core FeeTakingHook in a local
  #      PoolManager). Needs no RPC; always runs.
  #   2. The actual-Pons suite against the real Robinhood Chain contracts at a pinned block.
  #      Needs the ROBINHOOD_FORK_RPC_URL secret (an archive-capable RPC). Without it this
  #      step FAILS with a BLOCKED annotation — a missing fork is never reported as a pass.
  foundry-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm-verification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned: Foundry's fork semantics change between releases (1.8 reports the
      # parent-chain block from NUMBER on Arbitrum-based chains like Robinhood Chain;
      # 1.5 did not). The suite is verified locally with this exact version.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install pinned Solidity dependencies
        run: scripts/install-deps.sh

      - name: Test-hook suite (no RPC)
        run: forge test -vv

      - name: Cache fork state for the pinned block
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-4663-62211539

      - name: Actual-Pons fork suite (pinned block 62211539)
        env:
          ROBINHOOD_FORK_RPC_URL: ${{ secrets.ROBINHOOD_FORK_RPC_URL }}
        run: |
          set +e
          scripts/fork-verify.sh
          code=$?
          if [ "$code" = "78" ]; then
            echo "::error title=Fork verification BLOCKED::$(node -e 'process.stdout.write(require("./evidence/status.json").reason||"fork infrastructure unavailable")')"
          fi
          exit $code

      - name: Upload fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-evidence
          path: evm-verification/evidence/
