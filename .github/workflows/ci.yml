name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A disposable PostgreSQL 16 service container, not a placeholder — it
    # starts empty on every run, so `prisma migrate deploy` below is a real
    # clean-install validation of the full migration chain (including the
    # restored 20250324020906_init baseline — see ARCHITECTURE.md §3/§5.6)
    # against real PostgreSQL, not just a string Prisma Client never
    # connects with. CI-only credentials; never production, never a
    # persisted/shared database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_migrate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_migrate_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U ci -d ci_migrate_test >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Migrate deploy (clean-install validation against a fresh database)
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
